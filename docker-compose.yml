services:
  app:
    build:
      context: .
      dockerfile: 'docker/php/Dockerfile'
    volumes:
      - type: bind
        source: ./.env
        target: /workdir/.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: &timezone "Europe/Lisbon"
  web:
    build:
      context: .
      dockerfile: 'docker/nginx/Dockerfile'
    ports:
      - '${APP_PORT:-80}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - net
    depends_on:
      - app
    environment:
      TZ: *timezone
  worker:
    build:
      context: .
      dockerfile: 'docker/php/Dockerfile'
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=120
    volumes:
      - type: bind
        source: ./.env
        target: /workdir/.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      TZ: *timezone
  db:
    build:
      context: docker/mariadb
      dockerfile: 'Dockerfile'
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: '${DB_DATABASE}'
      MARIADB_USER: '${DB_USERNAME}'
      MARIADB_PASSWORD: '${DB_PASSWORD}'
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
      TZ: *timezone
    volumes:
      - 'db-files:/var/lib/mysql'
    networks:
      - net
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-p${DB_PASSWORD}" ]
      retries: 10
      timeout: 30s
  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: always
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    environment:
      PMA_ARBITRARY: 0
      PMA_HOST: db
      PMA_PORT: '${DB_PORT:-3306}:3306'
    networks:
      - net
  grafana:
    image: grafana/grafana-oss:11.1.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-admin}'
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_USERS_DEFAULT_THEME: 'light'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/etc/grafana/dashboards/arm-soc-overview.json'
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      TZ: *timezone
    volumes:
      - './docker/grafana/provisioning:/etc/grafana/provisioning'
      - './docker/grafana/dashboards:/etc/grafana/dashboards'
      - 'grafana-files:/var/lib/grafana'
    networks:
      - net
networks:
  net:
    driver: bridge
volumes:
  db-files:
    driver: local
  grafana-files:
    driver: local
